<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Opération Citadelle - Centre de Commandement</title>
    <!-- Polices thématiques WW2 : Special Elite (effet machine à écrire d'époque) et Black Ops One (style stencil militaire) -->
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Special+Elite&family=Oswald:wght@500;700&display=swap" rel="stylesheet">

    <style>
        :root {
            /* Palette WW2 Opération Citadelle (Vert Olive, Ocre, Bunker) */
            --accent-main: #556b2f;       /* Vert olive militaire */
            --accent-bright: #cd853f;     /* Ocre / Khaki clair */
            --accent-dark: #2e3b1f;       /* Vert armée sombre */
            --accent-glow: rgba(205, 133, 63, 0.25);
            --bg-card: rgba(20, 24, 20, 0.90);
            --border-color: rgba(110, 125, 90, 0.4);
            --grid-color: rgba(85, 107, 47, 0.05);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #101410 url("background.png") no-repeat center center fixed;
            background-size: cover;
            font-family: 'Oswald', sans-serif;
            color: #ebf0e6;
            height: 100vh;
            user-select: none;
        }

        /* OVERLAY MILITAIRE & EFFET VIGNETTE / CARTE DE CAMPAGNE */
        #overlay {
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at center, rgba(15, 18, 15, 0.4) 0%, rgba(8, 10, 8, 0.95) 100%),
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
            background-size: 100% 100%, 40px 40px, 40px 40px;
            z-index: 1;
        }

        /* Effet Grain & Bruit de Film Ancien */
        #overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(to bottom, rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15) 2px, transparent 2px, transparent 4px);
            pointer-events: none;
            opacity: 0.7;
        }

        /* VIGNETTE D'ÉTAT-MAJOR SOMBRE */
        #ambient-glow {
            position: fixed;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 150px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            z-index: 2;
        }

        /* PANNEAU MILITAIRE STYLE CADRE DE CAMPAGNE */
        .tactical-border {
            position: relative;
            background: var(--bg-card);
            border: 2px solid var(--border-color);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8), inset 0 0 15px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        /* Coins métalliques / renforts de caisse militaire */
        .tactical-border::before, .tactical-border::after {
            content: "";
            position: absolute;
            width: 14px;
            height: 14px;
            border-color: var(--accent-bright);
            border-style: solid;
            pointer-events: none;
        }
        .tactical-border::before {
            top: -2px; left: -2px;
            border-width: 3px 0 0 3px;
        }
        .tactical-border::after {
            bottom: -2px; right: -2px;
            border-width: 0 3px 3px 0;
        }

        /* STRUCTURE GLOBALE */
        #main-hud {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 45px 50px;
            z-index: 3;
        }

        /* HEADER */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 25px;
            background: rgba(10, 12, 10, 0.4);
            border-radius: 4px;
            padding: 15px 25px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        #logo {
            width: 75px;
            height: 75px;
            object-fit: contain;
            filter: sepia(0.6) hue-rotate(45deg) contrast(1.2);
            border: 1px solid var(--border-color);
            padding: 3px;
            background: rgba(0, 0, 0, 0.3);
        }

        #title-container {
            display: flex;
            flex-direction: column;
        }

        #title {
            font-family: 'Black Ops One', cursive;
            font-size: 32px;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ebf0e6;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        #subtitle {
            font-size: 13px;
            color: var(--accent-bright);
            letter-spacing: 3px;
            font-family: 'Special Elite', cursive;
            text-transform: uppercase;
            margin-top: 5px;
        }

        .header-right {
            text-align: right;
            font-family: 'Special Elite', cursive;
            font-size: 13px;
            letter-spacing: 1.5px;
            color: #9ba591;
            line-height: 1.8;
            border-left: 3px solid var(--accent-main);
            padding-left: 20px;
        }

        .highlight-text {
            color: var(--accent-bright);
            font-weight: bold;
        }

        /* REGISTRE DES TÉLÉGRAMMES / COMMANDEMENT */
        .hud-center {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            margin: 30px 0;
        }

        #terminal {
            width: 950px;
            max-width: 100%;
            height: 280px;
            padding: 25px;
            overflow-y: hidden;
            font-family: 'Special Elite', cursive;
            font-size: 15px;
            color: #d8decb;
            background: rgba(15, 18, 15, 0.85);
        }

        #log {
            line-height: 2;
        }

        .log-entry {
            opacity: 0;
            animation: fadeInLog 0.3s ease-out forwards;
            display: flex;
            align-items: center;
            letter-spacing: 1px;
        }

        .log-entry::before {
            content: "► [QG-ORDRE] ";
            color: var(--accent-bright);
            margin-right: 12px;
            font-weight: bold;
        }

        @keyframes fadeInLog {
            from { transform: translateY(6px); opacity: 0; }
            to { transform: translateY(0); opacity: 0.95; }
        }

        #line {
            animation: blink 0.8s infinite;
            color: var(--accent-bright);
            font-weight: bold;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* BAS DE PAGE (BARRE DE DEPLOIEMENT) */
        .hud-footer {
            border-top: 2px solid var(--border-color);
            padding-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #status-container {
            width: 100%;
            max-width: 750px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            font-family: 'Special Elite', cursive;
            font-size: 13px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9ba591;
        }

        #status {
            color: #ebf0e6;
            font-weight: 600;
        }

        #counter {
            color: var(--accent-bright);
            font-weight: bold;
        }

        #progress-container {
            width: 100%;
            max-width: 750px;
            height: 14px;
            background: rgba(10, 12, 10, 0.8);
            border: 1px solid var(--border-color);
            border-radius: 2px;
            overflow: hidden;
            padding: 2px;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-dark) 0%, var(--accent-main) 60%, var(--accent-bright) 100%);
            border-radius: 1px;
            box-shadow: 0 0 10px var(--accent-glow);
            transition: width 0.3s ease-out;
        }

        /* META DONNÉES ET MENTION DU SECTEUR DE KURSK */
        .hud-meta {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-family: 'Special Elite', cursive;
            font-size: 12px;
            color: #728065;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
    </style>
</head>

<body>

<div id="overlay"></div>
<div id="ambient-glow"></div>

<div id="main-hud">

    <!-- En-tête Militaire WW2 -->
    <div class="hud-header">
        <div class="header-left">
            <img id="logo" src="logo.png" alt="Insigne">
            <div id="title-container">
                <div id="title">OPÉRATION CITADELLE</div>
                <div id="subtitle">Front de l'Est • Quartier Général du Secteur</div>
            </div>
        </div>
        <div class="header-right">
            THÉÂTRE : <span class="highlight-text">SECTEUR DE KURSK (1943)</span><br>
            STATUT DU RÉGIMENT : EN COURS DE DÉPLOIEMENT
        </div>
    </div>

    <!-- Zone Centrale (Registre des Transmissions) -->
    <div class="hud-center">
        <div id="terminal" class="tactical-border">
            <div id="log"></div>
            <span id="line">█</span>
        </div>
    </div>

    <!-- Barre de Progression & Ordres de Déploiement -->
    <div class="hud-footer">
        <div id="status-container">
            <span id="status">Réception des dépêches de l'état-major...</span>
            <span id="counter">0%</span>
        </div>
        <div id="progress-container">
            <div id="progress"></div>
        </div>
        
        <div class="hud-meta">
            <div>ACCÈS RESTREINT : DOCUMENT CLASSIFIÉ DE RANG I</div>
            <div>TRANSMISSION RADIO : LIAISON SÉCURISÉE DU FRONT</div>
        </div>
    </div>

</div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<script>
    const log = document.getElementById("log");
    const progress = document.getElementById("progress");
    const status = document.getElementById("status");
    const counter = document.getElementById("counter");

    let percent = 0;
    let currentMsgIndex = 0;
    let totalFiles = 100;
    let neededFiles = 0;

    // Messages immersifs adaptés à la Seconde Guerre Mondiale (Opération Citadelle)
    const messages = [
        "Établissement du canal radio avec le Poste de Commandement...",
        "Déchiffrement des cartes d'état-major du secteur...",
        "Inspection des approvisionnements et des stocks de munitions...",
        "Chargement des directives d'engagement tactique...",
        "Synchronisation de la logistique des blindés et pièces d'artillerie...",
        "Réception des relevés de reconnaissance aérienne...",
        "Téléchargement de la liste d'affectation des régiments...",
        "Analyse de la ligne de front et des tranchées ennemies...",
        "Validation du bon d'affectation par le Haut Commandement...",
        "Préparation de l'armement individuel et des équipements...",
        "Canal stabilisé à 100%. Unités parées pour l'offensive."
    ];

    function addLine(text) {
        const entry = document.createElement("div");
        entry.className = "log-entry";
        entry.innerText = text;
        log.appendChild(entry);
        
        const terminal = document.getElementById("terminal");
        terminal.scrollTop = terminal.scrollHeight;
        
        while (log.childNodes.length > 8) {
            log.removeChild(log.firstChild);
        }
    }

    function load() {
        if (percent < 100) {
            percent += Math.floor(Math.random() * 6) + 2;
            if (percent > 100) percent = 100;

            updateProgress(percent);

            if (currentMsgIndex < messages.length && percent > (currentMsgIndex * (100 / messages.length))) {
                addLine(messages[currentMsgIndex]);
                status.innerText = messages[currentMsgIndex];
                currentMsgIndex++;
            }

            setTimeout(load, 500);
        } else {
            progress.style.width = "100%";
            counter.innerText = "100%";
            status.innerText = "Déploiement sur la ligne de front...";
            addLine("Ordres transmis : PRÊT POUR LE COMBAT.");
        }
    }

    function updateProgress(percentage) {
        progress.style.width = percentage + "%";
        counter.innerText = Math.round(percentage) + "%";
    }

    // Integrations Garry's Mod
    function SetFilesNeeded(needed) {
        neededFiles = needed;
        addLine("Mise à jour logistique : " + needed + " caisses de ravitaillement requises.");
    }

    function SetFilesTotal(total) {
        totalFiles = total;
    }

    function DownloadingFile(filename) {
        status.innerText = "Réception : " + filename;
        addLine("Téléchargement du dossier : " + filename);
        
        if (neededFiles > 0) {
            let filesDownloaded = totalFiles - neededFiles;
            let dynamicPercent = (filesDownloaded / totalFiles) * 100;
            updateProgress(Math.min(dynamicPercent, 99));
        }
    }

    function SetStatusChanged(statusText) {
        let frenchStatus = statusText;
        if (statusText === "Getting Addon Info") frenchStatus = "Analyse des rapports d'armement...";
        else if (statusText === "Mounting Addons") frenchStatus = "Préparation des équipements du front...";
        else if (statusText === "Workshop Complete") frenchStatus = "Vérification des registres militaire terminée.";
        
        status.innerText = frenchStatus;
        addLine(frenchStatus);
    }

    const music = document.getElementById("music");
    setTimeout(() => {
        music.volume = 0.08;
        music.play().catch(() => {
            console.log("Lecture audio en attente d'interaction utilisateur.");
        });
    }, 1000);

    if (!navigator.userAgent.includes("GMod")) {
        setTimeout(load, 500);
    }
</script>

</body>
</html>
