<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Poing de Vador</title>

  <!-- Police techno/militaire -->
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* =====================
       STYLE GÉNÉRAL
    ====================== */
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      color: #ff2a2a;
      background-color: #000;
      background-image: radial-gradient(circle at 20% 20%, #220000 0%, #000 70%);
    }

    /* Fond animé de type "hyperespace" / "étoiles" */
    body::before {
      content: "";
      position: absolute;
      top: 0; left: 0;
      width: 200%; height: 200%;
      background: url("https://www.transparenttextures.com/patterns/stardust.png") repeat;
      opacity: 0.2;
      animation: starScroll 120s linear infinite;
      z-index: -3;
    }

    @keyframes starScroll {
      from { transform: translate(0,0); }
      to { transform: translate(-50%,-50%); }
    }

    /* Overlay rouge holographique */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: radial-gradient(circle at center, rgba(255,0,0,0.05), rgba(0,0,0,0.9) 90%);
      mix-blend-mode: overlay;
      z-index: -2;
    }

    /* =====================
       CONTENEUR PRINCIPAL
    ====================== */
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      position: relative;
      z-index: 5;
    }

    /* Logo du Poing de Vador */
    #logo {
      position: absolute;
      top: 40px;
      left: 40px;
      width: 110px;
      filter: drop-shadow(0 0 15px #ff0000);
    }

    /* Vidéo de fond */
    #loading-video {
      position: absolute;
      top: 0; left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.4) contrast(1.2) saturate(1.4);
    }

    /* Titre principal */
    #title {
      font-size: 64px;
      text-transform: uppercase;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000, 0 0 30px #c00000;
      letter-spacing: 6px;
      animation: flicker 4s infinite;
    }

    @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
      20%, 24%, 55% { opacity: 0.6; }
    }

    /* Sous-titre (effet terminal de commandement) */
    #subtitle {
      font-size: 22px;
      color: #ff3c3c;
      border-right: 2px solid #ff3c3c;
      white-space: nowrap;
      overflow: hidden;
      width: 0;
      margin-top: 15px;
      animation: typing 5s steps(60, end) forwards, blink .75s step-end infinite;
    }

    @keyframes typing {
      from { width: 0 }
      to { width: 420px; }
    }

    @keyframes blink {
      0%, 100% { border-color: transparent }
      50% { border-color: #ff3c3c }
    }

    /* Texte en bas : progression / statut */
    #loading-info {
      position: absolute;
      bottom: 40px;
      text-transform: uppercase;
      font-size: 18px;
      color: #ff5555;
      letter-spacing: 2px;
      text-shadow: 0 0 5px #ff0000;
      animation: pulse 3s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Petit cadre holographique */
    #frame {
      position: absolute;
      top: 10%;
      left: 10%;
      right: 10%;
      bottom: 10%;
      border: 1px solid rgba(255,0,0,0.4);
      box-shadow: inset 0 0 25px rgba(255,0,0,0.2);
      border-radius: 10px;
      animation: scanlines 1.2s infinite linear;
      z-index: 0;
    }

    @keyframes scanlines {
      0% { box-shadow: inset 0 0 25px rgba(255,0,0,0.3); }
      50% { box-shadow: inset 0 0 40px rgba(255,0,0,0.5); }
      100% { box-shadow: inset 0 0 25px rgba(255,0,0,0.3); }
    }
  </style>
</head>
<body>
  <div id="frame"></div>
  <div id="loading-container">
    <video id="loading-video" autoplay loop muted>
      <source src="empire_intro.mp4" type="video/mp4">
      Ton navigateur ne supporte pas la lecture de vidéos.
    </video>

    <img id="logo" src="enclave_logo.png" alt="Logo Enclave" />
    <div id="title">POING DE VADOR</div>
    <div id="subtitle">[ Initialisation du centre de commandement impérial... ]</div>
    <div id="loading-info">Connexion au réseau tactique de Coruscant...</div>
  </div>

  <audio id="background-audio" loop>
    <source src="enclave_theme.mp3" type="audio/mp3">
  </audio>

  <audio id="terminal-beep" preload="auto">
    <source src="terminal_beep.mp3" type="audio/mp3">
  </audio>

  <script>
    const audio = document.getElementById("background-audio");
    const beep = document.getElementById("terminal-beep");

    setTimeout(() => {
      audio.volume = 0.05;
      audio.play();
    }, 2000);

    window.addEventListener("DOMContentLoaded", () => {
      beep.volume = 0.2;
      beep.play();
    });
  </script>
</body>
</html>
