<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Nyvaris Eltarius - Deployment HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght::400;600;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            /* DA UI : Conversion vers le thème Bleuté Tactique */
            --accent-main: #00a0ff;
            --accent-dark: #003c82;
            --accent-glow: rgba(0, 160, 255, 0.45);
            --bg-card: rgba(6, 9, 15, 0.75);
            --border-color: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #06090f url("background.png") no-repeat center center fixed;
            background-size: cover;
            font-family: 'Orbitron', sans-serif;
            color: #ffffff;
            height: 100vh;
            user-select: none;
        }

        /* OVERLAY HIGH-TECH & SCI-FI VIGNETTE */
        #overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at center, rgba(6, 9, 15, 0.4) 0%, rgba(3, 4, 7, 0.9) 100%);
            z-index: 1;
        }

        #overlay::after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.015), rgba(255, 255, 255, 0.015) 1px, transparent 1px, transparent 4px);
            pointer-events: none;
        }

        /* GLOW BACKGROUND EFFETS */
        #ambient-glow {
            position: fixed;
            width: 1200px;
            height: 500px;
            background: radial-gradient(ellipse at center, rgba(0, 160, 255, 0.15), transparent 70%);
            bottom: -150px;
            left: 50%;
            transform: translateX(-50%);
            pointer-events: none;
            z-index: 2;
        }

        /* MAIN CONTAINER */
        #main-hud {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 50px 60px;
            z-index: 3;
        }

        /* TOP BANNER */
        .hud-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 20px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        #logo {
            width: 70px;
            height: 70px;
            object-fit: contain;
            filter: drop-shadow(0 0 10px var(--accent-glow));
        }

        #title-container {
            display: flex;
            flex-direction: column;
        }

        #title {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: 4px;
            text-transform: uppercase;
            background: linear-gradient(180deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #subtitle {
            font-size: 12px;
            color: #94a3b8;
            letter-spacing: 3px;
            font-family: 'Share Tech Mono', monospace;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .header-right {
            text-align: right;
            font-family: 'Share Tech Mono', monospace;
            font-size: 13px;
            letter-spacing: 2px;
            color: #94a3b8;
            line-height: 1.6;
        }

        .highlight-text {
            color: var(--accent-main);
            font-weight: bold;
        }

        /* CENTER: TERMINAL LOGS MODERNE */
        .hud-center {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            margin: 40px 0;
        }

        #terminal {
            width: 900px;
            max-width: 100%;
            height: 240px;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-left: 4px solid var(--accent-main);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5);
            padding: 25px;
            overflow: hidden;
            font-family: 'Share Tech Mono', monospace;
            font-size: 14px;
            color: #e2e8f0;
            backdrop-filter: blur(8px);
            clip-path: polygon(0 0, calc(100% - 15px) 0, 100% 15px, 100% 100%, 15px 100%, 0 calc(100% - 15px));
        }

        #log {
            line-height: 1.8;
        }

        .log-entry {
            opacity: 0;
            animation: fadeInLog 0.4s forwards;
            display: flex;
            align-items: center;
        }

        .log-entry::before {
            content: "└ [SECURE] ";
            color: var(--accent-main);
            margin-right: 10px;
            font-weight: bold;
        }

        @keyframes fadeInLog {
            to { opacity: 0.85; }
        }

        #line {
            animation: blink 1s infinite;
            color: var(--accent-main);
            font-weight: bold;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* BOTTOM BANNER */
        .hud-footer {
            border-top: 1px solid var(--border-color);
            padding-top: 25px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #status-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #94a3b8;
        }

        #status {
            color: #ffffff;
            font-weight: 600;
        }

        #counter {
            color: var(--accent-main);
        }

        #progress-container {
            width: 100%;
            max-width: 650px;
            height: 8px;
            background: rgba(0, 160, 255, 0.05);
            border: 1px solid rgba(0, 160, 255, 0.15);
            border-radius: 4px;
            overflow: hidden;
            padding: 1px;
        }

        #progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-main) 0%, #ffffff 100%);
            border-radius: 2px;
            box-shadow: 0 0 12px var(--accent-glow);
            transition: width 0.4s ease-out;
        }

        /* INFO FOOTER */
        .hud-meta {
            width: 100%;
            display: flex;
            justify-content: space-between;
            margin-top: 25px;
            font-family: 'Share Tech Mono', monospace;
            font-size: 11px;
            color: #64748b;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>

<div id="overlay"></div>
<div id="ambient-glow"></div>

<div id="main-hud">

    <div class="hud-header">
        <div class="header-left">
            <img id="logo" src="logo.png" alt="Logo">
            <div id="title-container">
                <div id="title">Nyvaris Eltarius</div>
                <div id="subtitle">Apex Cohortis Imperialis • Hub de Déploiement Tactique</div>
            </div>
        </div>
        <div class="header-right">
            REGIMENT : <span class="highlight-text">COHORTIS LISA XAN DRAKARILIA</span><br>
            STATUS ORIENTATION : UNITÉ D'ÉLITE
        </div>
    </div>

    <div class="hud-center">
        <div id="terminal">
            <div id="log"></div>
            <span id="line">█</span>
        </div>
    </div>

    <div class="hud-footer">
        <div id="status-container">
            <span id="status">Initialisation des systèmes impériaux...</span>
            <span id="counter">0%</span>
        </div>
        <div id="progress-container">
            <div id="progress"></div>
        </div>
        
        <div class="hud-meta">
            <div>ACCÈS RESTREINT : HAUT COMMANDEMENT DE L'EMPIRE</div>
            <div>STATUS : CONNEXION SÉCURISÉE CRITIQUE</div>
        </div>
    </div>

</div>

<audio id="music" loop>
    <source src="music.mp3" type="audio/mp3">
</audio>

<script>
    const log = document.getElementById("log");
    const progress = document.getElementById("progress");
    const status = document.getElementById("status");
    const counter = document.getElementById("counter");

    let percent = 0;
    let currentMsgIndex = 0;

    const messages = [
        "Établissement du lien crypté avec Nyvaris Eltarius...",
        "Vérification des signatures de l'Apex Cohortis Imperialis...",
        "Chargement des protocoles d'intervention de l'Oscura Custodes...",
        "Séquençage des verrous neuronaux de sécurité...",
        "Synchronisation de l'armement lourd et des équipements impériaux...",
        "Récupération des coordonnées de largage tactique...",
        "Téléchargement du manifeste des modules de l'armurerie...",
        "Analyse de la zone de déploiement en cours...",
        "Validation des accréditations par le Haut Commandement...",
        "Préparation de l'armure de l'unité d'élite...",
        "Liaison stabilisée. Prêt pour l'insertion."
    ];

    function addLine(text) {
        const entry = document.createElement("div");
        entry.className = "log-entry";
        entry.innerText = text;
        log.appendChild(entry);
        
        const terminal = document.getElementById("terminal");
        terminal.scrollTop = terminal.scrollHeight;
    }

    function load() {
        if (percent < 100) {
            percent += Math.floor(Math.random() * 8) + 2;
            if (percent > 100) percent = 100;

            progress.style.width = percent + "%";
            counter.innerText = percent + "%";

            if (currentMsgIndex < messages.length && percent > (currentMsgIndex * (100 / messages.length))) {
                addLine(messages[currentMsgIndex]);
                status.innerText = messages[currentMsgIndex];
                currentMsgIndex++;
            }

            setTimeout(load, 600);
        } else {
            progress.style.width = "100%";
            counter.innerText = "100%";
            status.innerText = "Déploiement imminent...";
            addLine("Statut d'affectation : OPÉRATIONNEL.");
        }
    }

    // GMOD INTEGRATION NATIF (Inchangé)
    function DownloadingFile(filename) {
        status.innerText = "Téléchargement : " + filename;
        addLine("Téléchargement de l'archive impériale : " + filename);
    }

    function SetStatusChanged(statusText) {
        status.innerText = statusText;
        addLine(statusText);
    }

    function SetFilesNeeded(needed) {
        addLine("Mise à jour requise : " + needed + " fichiers manquants.");
    }

    // Gestion de la musique
    const music = document.getElementById("music");
    
    // Tentative d'auto-play
    setTimeout(() => {
        music.volume = 0.05;
        music.play().catch(() => {});
    }, 1500);

    // Lancement du chargement de simulation (si pas de GMod)
    setTimeout(load, 500);

</script>

</body>
</html>
