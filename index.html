<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Centralist United States | Apo-Serious RP | PVE</title>

  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      font-family: 'Orbitron', sans-serif;
      color: #ff2a2a;
      background-color: #000;
    }

    /* ---- IMAGE DE FOND ---- */
    #background-image {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(0.45) contrast(1.2) saturate(1.3);
      transition: opacity 1.5s ease-in-out;
    }

    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      position: relative;
      z-index: 5;
    }

    #logo {
      position: absolute;
      top: 40px;
      left: 40px;
      width: 110px;
      filter: drop-shadow(0 0 15px #ff0000);
    }

    #title {
      font-size: 64px;
      text-transform: uppercase;
      color: #ff0000;
      text-shadow: 0 0 10px #ff0000, 0 0 30px #c00000;
      letter-spacing: 6px;
      animation: flicker 4s infinite;
    }

    @keyframes flicker {
      0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
      20%, 24%, 55% { opacity: 0.6; }
    }

    #subtitle {
      font-size: 22px;
      color: #ff3c3c;
      border-right: 2px solid #ff3c3c;
      white-space: nowrap;
      overflow: hidden;
      margin-top: 15px;
      animation: typing 8s steps(100) forwards, blink .75s infinite step-end;
    }

    @keyframes typing { from { width: 0; } to { width: 100%; } }
    @keyframes blink { 0%,100% { border-color: transparent; } 50% { border-color: #ff3c3c; } }

    #loading-info {
      position: absolute;
      bottom: 40px;
      font-size: 18px;
      color: #ff5555;
      letter-spacing: 2px;
      text-shadow: 0 0 5px #ff0000;
      animation: pulse 3s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

  </style>
</head>
<body>

  <!-- IMAGE DE FOND -->
  <img id="background-image" src="image1.png" />

  <div id="loading-container">
    <img id="logo" src="enclave_logo.png" alt="Logo"/>
    <div id="title">Destinée Impériale</div>
    <div id="subtitle">[ Initialisation du Centre de Commandement Centralist https://discord.gg/QR4FbcmegE ]</div>
    <div id="loading-info">Connexion au réseau tactique de Fort Rids : https://discord.gg/QR4FbcmegE</div>
  </div>

  <audio id="background-audio" loop>
    <source src="enclave_theme.mp3" type="audio/mp3">
  </audio>

  <audio id="terminal-beep" preload="auto">
    <source src="terminal_beep.mp3" type="audio/mp3">
  </audio>

  <script>
    /* --- ROTATION DES IMAGES DE FOND --- */
    const images = [
      "image1.png",
      "image2.png",
      "image3.png"
    ];

    let index = 0;
    const bg = document.getElementById("background-image");

    setInterval(() => {
      bg.style.opacity = 0;
      setTimeout(() => {
        index = (index + 1) % images.length;
        bg.src = images[index];
        bg.style.opacity = 1;
      }, 1500);
    }, 6000); // change toutes les 6 secondes

    /* --- MUSIQUE --- */
    const audio = document.getElementById("background-audio");
    const beep = document.getElementById("terminal-beep");

    setTimeout(() => {
      audio.volume = 0.05;
      audio.play();
    }, 2000);

    window.addEventListener("DOMContentLoaded", () => {
      beep.volume = 0.2;
      beep.play();
    });
  </script>

</body>
</html>
