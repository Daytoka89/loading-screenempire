<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>H.C.F</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>

body{
margin:0;
padding:0;
overflow:hidden;
background:#000;
font-family:'Orbitron',sans-serif;
color:#ffd500;
}

/* VIDEO BACKGROUND */

#background-video{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
object-fit:cover;
z-index:-2;
filter:brightness(0.35) contrast(1.3) saturate(1.2);
}

/* SCANLINE EFFECT */

body:after{
content:"";
position:fixed;
width:100%;
height:100%;
background:repeating-linear-gradient(
to bottom,
rgba(255,213,0,0.03),
rgba(255,213,0,0.03) 1px,
transparent 1px,
transparent 3px
);
pointer-events:none;
z-index:5;
}

/* MAIN CONTAINER */

#main{
position:absolute;
width:100%;
height:100%;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
}

/* LOGO */

#logo{
width:120px;
margin-bottom:15px;
filter:drop-shadow(0 0 15px #ffd500);
}

/* TITLE */

#title{
font-size:55px;
letter-spacing:6px;
color:#ffd500;
text-shadow:0 0 10px #ffd500,0 0 25px #b38f00;
margin-bottom:10px;
}

/* SUBTITLE */

#subtitle{
font-size:16px;
color:#fff3a3;
letter-spacing:3px;
margin-bottom:40px;
font-family:'Share Tech Mono', monospace;
}

/* TERMINAL */

#terminal{
width:800px;
max-width:90%;
height:260px;
background:rgba(0,0,0,0.75);
border:2px solid #ffd500;
box-shadow:0 0 20px #ffd500;
padding:20px;
overflow:hidden;
text-align:left;
font-family:'Share Tech Mono', monospace;
font-size:15px;
color:#ffe066;
}

#line{
animation:blink 1s infinite;
}

@keyframes blink{
0%{opacity:1;}
50%{opacity:0;}
100%{opacity:1;}
}

/* PROGRESS BAR */

#progress-container{
margin-top:35px;
width:400px;
max-width:80%;
height:18px;
border:1px solid #ffd500;
background:rgba(0,0,0,0.6);
}

#progress{
height:100%;
width:0%;
background:linear-gradient(90deg,#ffd500,#fff3a3);
box-shadow:0 0 10px #ffd500;
transition:width 0.3s;
}

/* STATUS */

#status{
margin-top:12px;
font-size:14px;
letter-spacing:2px;
color:#ffe066;
font-family:'Share Tech Mono', monospace;
}

/* CORNER HUD */

#corner{
position:absolute;
bottom:20px;
right:30px;
font-size:12px;
font-family:'Share Tech Mono', monospace;
color:#ffd500;
text-align:right;
}

</style>
</head>

<body>

<video id="background-video" autoplay muted loop>
<source src="loading.webm" type="video/webm">
</video>

<div id="main">

<img id="logo" src="enclave_logo.png">

<div id="title">Host Capture Force</div>

<div id="subtitle">
Secure Corporate Network
</div>

<div id="terminal" id="terminal">
<div id="log"></div>
<span id="line">█</span>
</div>

<div id="progress-container">
<div id="progress"></div>
</div>

<div id="status">Initialisation du réseau Host Capture Force...</div>

</div>

<div id="corner">

Server Classification : BLACK LEVEL<br>
Access : Restricted<br>
H.C.F Secure Network

</div>

<audio id="music" loop>
<source src="enclave_theme.mp3" type="audio/mp3">
</audio>

<script>

const log = document.getElementById("log")
const progress = document.getElementById("progress")
const status = document.getElementById("status")

let percent = 0

const messages = [

"Connexion au réseau H.C.F... https://discord.gg/bZJ7KGuMZd",
"Authentification sécurisée...",
"Accès aux bases de données biologiques...",
"Synchronisation des laboratoires...",
"Chargement des protocoles de confinement...",
"Initialisation des agents...",
"Chargement des ressources du serveur...",
"Synchronisation...",
"Connexion au database...",
"Bienvenue chez Host Capture Force..."

]

let i = 0

function addLine(text){

log.innerHTML += text + "<br>"
log.scrollTop = log.scrollHeight

}

function load(){

if(percent < 100){

percent += Math.random()*8

progress.style.width = percent+"%"

if(i < messages.length){
addLine("> " + messages[i])
status.innerText = messages[i]
i++
}

setTimeout(load,900)

}else{

status.innerText = "Connexion établie"

}

}

load()

/* MUSIC */

const music = document.getElementById("music")

setTimeout(()=>{
music.volume=0.05
music.play()
},2000)

</script>

</body>
</html>
